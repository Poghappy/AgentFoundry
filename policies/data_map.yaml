# 隐私权利管理
privacy_rights:
  # 数据主体权利
  data_subject_rights:
    # 访问权 (GDPR Article 15)
    right_of_access:
      enabled: true
      response_time: 30  # 天
      verification_required: true
      automated_response: false
      contact_email: "privacy@agentfoundry.com"
      request_form_url: "https://agentfoundry.com/privacy/access-request"

    # 更正权 (GDPR Article 16)
    right_to_rectification:
      enabled: true
      response_time: 30  # 天
      verification_required: true
      automated_correction: false
      contact_email: "privacy@agentfoundry.com"

    # 删除权 (GDPR Article 17)
    right_to_erasure:
      enabled: true
      response_time: 30  # 天
      verification_required: true
      exceptions:
        - "legal_obligation"
        - "legitimate_interest"
        - "contract_performance"
      automated_deletion: true
      contact_email: "privacy@agentfoundry.com"

    # 限制处理权 (GDPR Article 18)
    right_to_restrict_processing:
      enabled: true
      response_time: 30  # 天
      verification_required: true
      automated_restriction: false
      contact_email: "privacy@agentfoundry.com"

    # 数据可携权 (GDPR Article 20)
    right_to_data_portability:
      enabled: true
      response_time: 30  # 天
      verification_required: true
      supported_formats:
        - "JSON"
        - "CSV"
        - "XML"
      automated_export: true
      contact_email: "privacy@agentfoundry.com"

    # 反对权 (GDPR Article 21)
    right_to_object:
      enabled: true
      response_time: 30  # 天
      verification_required: true
      automated_opt_out: true
      contact_email: "privacy@agentfoundry.com"

  # 权利请求处理流程
  request_processing:
    # 身份验证
    identity_verification:
      required: true
      methods:
        - "email_verification"
        - "account_login"
        - "government_id" # 仅限敏感请求
      verification_timeout: 7  # 天

    # 请求跟踪
    request_tracking:
      enabled: true
      ticket_system: "zendesk"
      status_updates: true
      automated_notifications: true

    # 响应模板
    response_templates:
      access_response: "access_request_response.html"
      deletion_confirmation: "deletion_confirmation.html"
      rectification_confirmation: "rectification_confirmation.html"
      restriction_confirmation: "restriction_confirmation.html"

# 同意管理
consent_management:
  # 同意收集
  consent_collection:
    granular_consent: true
    opt_in_required: true
    clear_language: true
    withdrawal_mechanism: true
    consent_records:
      retention_period: 1095  # 3年
      proof_of_consent: true
      timestamp_required: true
      ip_address_logging: true

  # 同意类型
  consent_types:
    marketing:
      required: false
      purpose: "营销通信和推广"
      withdrawal_url: "https://agentfoundry.com/unsubscribe"
    analytics:
      required: false
      purpose: "网站分析和改进"
      withdrawal_method: "cookie_settings"
    functional:
      required: true
      purpose: "基本服务功能"
      withdrawal_method: "account_deletion"

  # 同意状态跟踪
  consent_tracking:
    enabled: true
    database_table: "user_consents"
    audit_trail: true
    version_control: true

# 数据安全措施
security_measures:
  # 技术措施
  technical_measures:
    encryption:
      at_rest:
        enabled: true
        algorithm: "AES-256-GCM"
        key_management: "AWS KMS"
        key_rotation: 90  # 天
      in_transit:
        enabled: true
        protocol: "TLS 1.3"
        certificate_management: "Let's Encrypt"
        hsts_enabled: true
      in_processing:
        enabled: true
        method: "homomorphic_encryption"
        use_cases: ["analytics", "ml_training"]

    access_control:
      authentication:
        mfa_required: true
        password_policy:
          min_length: 12
          complexity_required: true
          rotation_period: 90  # 天
        session_management:
          timeout: 30  # 分钟
          concurrent_sessions: 3
      authorization:
        rbac_enabled: true
        principle_of_least_privilege: true
        regular_access_reviews: true
        review_frequency: 90  # 天

    data_loss_prevention:
      enabled: true
      scanning:
        email_scanning: true
        file_upload_scanning: true
        database_monitoring: true
      policies:
        - "block_pii_transmission"
        - "encrypt_sensitive_files"
        - "monitor_data_exports"

    monitoring_and_logging:
      security_monitoring:
        enabled: true
        siem_integration: true
        real_time_alerts: true
      audit_logging:
        enabled: true
        log_retention: 365  # 天
        log_integrity: true
        centralized_logging: true

  # 组织措施
  organizational_measures:
    privacy_governance:
      dpo_appointed: true
      privacy_team: true
      privacy_policies: true
      regular_training: true
      training_frequency: 180  # 天

    incident_response:
      enabled: true
      response_team: true
      escalation_procedures: true
      notification_procedures:
        internal_notification: 4  # 小时
        regulatory_notification: 72  # 小时
        data_subject_notification: 72  # 小时
      breach_register: true

    vendor_management:
      due_diligence: true
      privacy_assessments: true
      contractual_safeguards: true
      regular_audits: true
      audit_frequency: 365  # 天

# 跨境数据传输
international_transfers:
  # 传输机制
  transfer_mechanisms:
    adequacy_decisions:
      enabled: true
      approved_countries:
        - "Canada"
        - "Japan"
        - "South Korea"
    standard_contractual_clauses:
      enabled: true
      version: "2021 SCCs"
      supplementary_measures: true
    binding_corporate_rules:
      enabled: false
    certification_schemes:
      enabled: false

  # 传输评估
  transfer_assessment:
    impact_assessment_required: true
    legal_analysis: true
    technical_safeguards: true
    ongoing_monitoring: true

  # 传输记录
  transfer_records:
    enabled: true
    details_recorded:
      - "recipient_details"
      - "transfer_purpose"
      - "data_categories"
      - "safeguards_applied"
      - "transfer_date"
    retention_period: 1095  # 3年

# 数据保护影响评估 (DPIA)
dpia:
  # DPIA触发条件
  triggers:
    - "large_scale_processing"
    - "sensitive_data_processing"
    - "systematic_monitoring"
    - "automated_decision_making"
    - "new_technology_use"

  # DPIA流程
  process:
    preliminary_assessment: true
    stakeholder_consultation: true
    dpo_consultation: true
    risk_assessment: true
    mitigation_measures: true
    monitoring_plan: true

  # DPIA模板
  template:
    sections:
      - "processing_description"
      - "necessity_assessment"
      - "risk_identification"
      - "risk_analysis"
      - "mitigation_measures"
      - "residual_risks"
      - "monitoring_plan"
    approval_required: true
    review_frequency: 365  # 天

# 监控和审计
monitoring:
  # 合规监控
  compliance_monitoring:
    enabled: true
    automated_checks: true
    check_frequency: "daily"
    compliance_dashboard: true
    metrics:
      - "consent_rates"
      - "data_subject_requests"
      - "breach_incidents"
      - "retention_compliance"
      - "access_violations"

  # 性能监控
  performance_monitoring:
    enabled: true
    response_time_tracking: true
    availability_monitoring: true
    capacity_planning: true

  # 审计
  auditing:
    internal_audits:
      enabled: true
      frequency: 180  # 天
      scope: "full_privacy_program"
    external_audits:
      enabled: true
      frequency: 365  # 天
      certifications:
        - "ISO 27001"
        - "SOC 2 Type II"
    audit_trails:
      enabled: true
      immutable_logs: true
      retention_period: 2555  # 7年

# 培训和意识
training:
  # 员工培训
  employee_training:
    mandatory: true
    frequency: 180  # 天
    topics:
      - "GDPR基础知识"
      - "数据处理原则"
      - "数据主体权利"
      - "安全最佳实践"
      - "事件响应程序"
    completion_tracking: true
    certification_required: true

  # 专业培训
  specialized_training:
    dpo_training:
      required: true
      certification: "IAPP CIPP/E"
      renewal_period: 730  # 2年
    developer_training:
      required: true
      topics:
        - "隐私设计"
        - "安全编码"
        - "数据最小化"
      frequency: 180  # 天

# 文档和记录
documentation:
  # 政策文档
  policies:
    privacy_policy:
      url: "https://agentfoundry.com/privacy"
      last_updated: "2024-01-15"
      review_frequency: 180  # 天
    cookie_policy:
      url: "https://agentfoundry.com/cookies"
      last_updated: "2024-01-15"
      review_frequency: 180  # 天
    data_retention_policy:
      url: "https://agentfoundry.com/data-retention"
      last_updated: "2024-01-15"
      review_frequency: 365  # 天

  # 记录保存
  record_keeping:
    processing_records: true
    consent_records: true
    breach_records: true
    dpia_records: true
    training_records: true
    audit_records: true
    retention_schedule: "privacy_record_retention_schedule.pdf"

# 元数据
metadata:
  tags:
    - "privacy"
    - "gdpr"
    - "data_protection"
    - "compliance"
  owner: "Privacy Team"
  maintainer: "Data Protection Officer"
  review_cycle: "quarterly"
  next_review_date: "2024-04-15"
  dependencies:
    - "cost_budget.yaml"
    - "approvals.yaml"
    - "model_policy.md"
  related_documents:
    - "privacy_policy.md"
    - "cookie_policy.md"
    - "data_retention_policy.md"
    - "incident_response_plan.md"