# AgentFoundry 数据映射与隐私政策配置
# Data Mapping and Privacy Policy Configuration

# 版本信息
version: "1.0.0"
created_date: "2024-01-15"
last_updated: "2024-01-15"
author: "AgentFoundry Team"

# 数据分类定义
data_classifications:
  # 个人身份信息 (PII)
  pii:
    level: "high_sensitivity"
    description: "可直接识别个人身份的信息"
    examples:
      - "姓名"
      - "邮箱地址"
      - "电话号码"
      - "身份证号"
      - "护照号码"
    handling_requirements:
      - "encryption_at_rest"
      - "encryption_in_transit"
      - "access_logging"
      - "data_masking"
      - "consent_required"
    retention_policy:
      default_retention: 30  # 天
      max_retention: 365     # 天
      deletion_method: "secure_wipe"

  # 敏感个人信息 (SPI)
  spi:
    level: "very_high_sensitivity"
    description: "特别敏感的个人信息"
    examples:
      - "财务信息"
      - "健康记录"
      - "生物特征"
      - "政治观点"
      - "宗教信仰"
    handling_requirements:
      - "end_to_end_encryption"
      - "multi_factor_authentication"
      - "audit_trail"
      - "explicit_consent"
      - "data_minimization"
    retention_policy:
      default_retention: 7   # 天
      max_retention: 90      # 天
      deletion_method: "cryptographic_erasure"

  # 商业机密
  confidential:
    level: "high_sensitivity"
    description: "商业机密和专有信息"
    examples:
      - "商业计划"
      - "财务数据"
      - "客户列表"
      - "技术规格"
      - "合同条款"
    handling_requirements:
      - "access_control"
      - "encryption_at_rest"
      - "watermarking"
      - "download_restrictions"
    retention_policy:
      default_retention: 365  # 天
      max_retention: 2555     # 7年
      deletion_method: "secure_deletion"

  # 内部使用
  internal:
    level: "medium_sensitivity"
    description: "内部使用的非敏感信息"
    examples:
      - "员工目录"
      - "内部文档"
      - "会议记录"
      - "项目状态"
    handling_requirements:
      - "access_control"
      - "backup_encryption"
    retention_policy:
      default_retention: 1095  # 3年
      max_retention: 3650      # 10年
      deletion_method: "standard_deletion"

  # 公开信息
  public:
    level: "low_sensitivity"
    description: "可公开访问的信息"
    examples:
      - "公司信息"
      - "产品文档"
      - "新闻发布"
      - "营销材料"
    handling_requirements:
      - "version_control"
      - "content_approval"
    retention_policy:
      default_retention: 1825  # 5年
      max_retention: -1        # 永久保留
      deletion_method: "standard_deletion"

# 数据集映射
datasets:
  # 用户反馈数据
  user_feedback:
    name: "用户反馈数据集"
    description: "收集的用户反馈和建议"
    classification: "pii"
    pii: true
    retention_days: 30
    encryption:
      at_rest: true
      in_transit: true
      method: "AES-256"
    masking:
      enabled: true
      fields:
        - "email"
        - "phone"
        - "name"
      method: "hash_with_salt"
    access_control:
      roles:
        - "product_manager"
        - "ux_researcher"
        - "data_analyst"
      approval_required: true
      audit_logging: true
    data_sources:
      - "feedback_forms"
      - "user_interviews"
      - "support_tickets"
      - "app_reviews"
    processing_purposes:
      - "product_improvement"
      - "user_experience_optimization"
      - "feature_prioritization"
    legal_basis: "legitimate_interest"
    consent_required: true
    data_subjects: "end_users"
    geographic_scope:
      - "EU"
      - "US"
      - "CA"
    transfer_restrictions:
      cross_border: false
      approved_countries: ["US", "CA"]
    backup_policy:
      enabled: true
      frequency: "daily"
      retention: 7  # 天
      encryption: true

  # 系统日志
  system_logs:
    name: "系统操作日志"
    description: "系统操作和访问日志"
    classification: "internal"
    pii: false
    retention_days: 90
    encryption:
      at_rest: true
      in_transit: true
      method: "AES-256"
    masking:
      enabled: true
      fields:
        - "ip_address"
        - "user_id"
      method: "pseudonymization"
    access_control:
      roles:
        - "system_administrator"
        - "security_analyst"
        - "devops_engineer"
      approval_required: false
      audit_logging: true
    data_sources:
      - "application_logs"
      - "web_server_logs"
      - "database_logs"
      - "security_logs"
    processing_purposes:
      - "system_monitoring"
      - "security_analysis"
      - "performance_optimization"
      - "troubleshooting"
    legal_basis: "legitimate_interest"
    consent_required: false
    data_subjects: "system_users"
    geographic_scope:
      - "global"
    transfer_restrictions:
      cross_border: true
      approved_countries: ["US", "EU", "CA"]
    backup_policy:
      enabled: true
      frequency: "daily"
      retention: 30  # 天
      encryption: true

  # 客户数据
  customer_data:
    name: "客户信息数据集"
    description: "客户基本信息和交易记录"
    classification: "pii"
    pii: true
    retention_days: 365
    encryption:
      at_rest: true
      in_transit: true
      method: "AES-256-GCM"
    masking:
      enabled: true
      fields:
        - "email"
        - "phone"
        - "address"
        - "payment_info"
      method: "tokenization"
    access_control:
      roles:
        - "customer_service"
        - "sales_manager"
        - "billing_admin"
      approval_required: true
      audit_logging: true
      mfa_required: true
    data_sources:
      - "registration_forms"
      - "payment_systems"
      - "crm_systems"
      - "support_interactions"
    processing_purposes:
      - "service_delivery"
      - "billing_and_payments"
      - "customer_support"
      - "legal_compliance"
    legal_basis: "contract_performance"
    consent_required: true
    data_subjects: "customers"
    geographic_scope:
      - "EU"
      - "US"
    transfer_restrictions:
      cross_border: false
      approved_countries: ["US"]
      adequacy_decisions: ["EU-US Privacy Shield"]
    backup_policy:
      enabled: true
      frequency: "daily"
      retention: 30  # 天
      encryption: true
      geographic_restrictions: true

  # 员工数据
  employee_data:
    name: "员工信息数据集"
    description: "员工个人信息和工作记录"
    classification: "spi"
    pii: true
    retention_days: 2555  # 7年 (法律要求)
    encryption:
      at_rest: true
      in_transit: true
      method: "AES-256-GCM"
    masking:
      enabled: true
      fields:
        - "ssn"
        - "bank_account"
        - "salary"
        - "performance_reviews"
      method: "format_preserving_encryption"
    access_control:
      roles:
        - "hr_manager"
        - "payroll_admin"
        - "legal_counsel"
      approval_required: true
      audit_logging: true
      mfa_required: true
      background_check_required: true
    data_sources:
      - "hr_systems"
      - "payroll_systems"
      - "time_tracking"
      - "performance_management"
    processing_purposes:
      - "employment_management"
      - "payroll_processing"
      - "legal_compliance"
      - "benefits_administration"
    legal_basis: "employment_contract"
    consent_required: false
    data_subjects: "employees"
    geographic_scope:
      - "US"
    transfer_restrictions:
      cross_border: false
      approved_countries: []
    backup_policy:
      enabled: true
      frequency: "daily"
      retention: 90  # 天
      encryption: true
      air_gapped: true

  # 研究数据
  research_data:
    name: "市场研究数据集"
    description: "市场调研和用户研究数据"
    classification: "pii"
    pii: true
    retention_days: 180
    encryption:
      at_rest: true
      in_transit: true
      method: "AES-256"
    masking:
      enabled: true
      fields:
        - "participant_name"
        - "contact_info"
      method: "anonymization"
    access_control:
      roles:
        - "research_analyst"
        - "product_manager"
        - "ux_researcher"
      approval_required: true
      audit_logging: true
    data_sources:
      - "surveys"
      - "interviews"
      - "focus_groups"
      - "usability_tests"
    processing_purposes:
      - "market_research"
      - "product_development"
      - "user_experience_research"
    legal_basis: "consent"
    consent_required: true
    data_subjects: "research_participants"
    geographic_scope:
      - "US"
      - "EU"
    transfer_restrictions:
      cross_border: true
      approved_countries: ["US", "CA"]
    backup_policy:
      enabled: true
      frequency: "weekly"
      retention: 14  # 天
      encryption: true

